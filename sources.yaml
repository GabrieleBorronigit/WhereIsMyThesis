# Sources for the quantum thesis proposals scraper.
# Each entry: url (required), name (optional, for logging/DB).

settings:
  # Re-scrape a URL only if the last successful scrape is older than this.
  rescrape_after_days: 7
  # Minimum visible-text length below which the page is considered JS-rendered
  # and Playwright is used as fallback.
  min_text_length: 500
  # Cap on cleaned text sent to the LLM (chars). Longer pages are truncated.
  max_text_chars: 60000
  # Minimum seconds between Anthropic API calls (rate limiting).
  api_min_interval_s: 1.5

sources:
  - url: https://qutechacademy.nl/master/thesis-projects/
    name: QuTech Academy (TU Delft)
  - url: https://quantumghent.github.io/studentinfo/thesis.html
    name: Quantum Group Ghent
  - url: https://www.ipa.fraunhofer.de/en/current-research/cyber-cognitive-intelligence-cci/quantencomputing/Theses-on-the-topic-of-quantum-computing.html
    name: Fraunhofer IPA - Quantum Computing
